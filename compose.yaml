services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: amr-outcome-api:latest
    network_mode: host
    volumes:
      - ./models:/app/models:ro
      - ./data/processed:/app/data/processed:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  prometheus:
    image: prom/prometheus:latest
    network_mode: host
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
      - monitor

  monitor:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: amr-outcome-api:latest
    command: ["uv", "run", "python", "src/monitoring/monitor.py"]
    network_mode: host
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./monitoring/reports:/app/monitoring/reports

  grafana:
    image: grafana/grafana:latest
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
