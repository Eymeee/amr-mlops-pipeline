services:
  amr-api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: amr-outcome-api:latest
    network_mode: host
    volumes:
      - ./models:/app/models:ro
      - ./data/processed:/app/data/processed:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
